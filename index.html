<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a24">
  <title>双摆 · 混沌运动模拟器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #1a1a24;
      color: #e7e8f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #9798ad;
      --line: rgba(177, 186, 230, .14);
      --accent: #82d9ff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 36px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(58, 70, 116, .19), transparent 55%),
        #1a1a24;
    }

    main { width: min(100%, 1000px); margin: 0 auto; }

    header { margin-bottom: 24px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.35rem); letter-spacing: -.04em; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: .95rem; }

    .simulator {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(25, 27, 40, .88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .22);
    }

    .stage {
      position: relative;
      height: clamp(360px, 58vw, 540px);
      min-height: 360px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(74, 86, 137, .12), transparent 54%),
        #191a25;
    }

    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }

    .stage-label {
      position: absolute;
      top: 18px;
      left: 20px;
      color: #aeb1c8;
      font-size: .77rem;
      letter-spacing: .08em;
      pointer-events: none;
    }

    .readouts {
      position: absolute;
      top: 16px;
      right: 18px;
      display: flex;
      gap: 18px;
      pointer-events: none;
    }

    .readout { min-width: 76px; text-align: right; }
    .readout span { display: block; color: var(--muted); font-size: .68rem; }
    .readout strong { display: block; margin-top: 3px; font-size: .95rem; font-variant-numeric: tabular-nums; }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr)) auto;
      gap: 18px;
      align-items: end;
      padding: 22px;
      border-top: 1px solid var(--line);
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: #b8b9cc;
      font-size: .8rem;
    }

    output { color: #e7e8f2; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .buttons { display: flex; gap: 9px; }

    button {
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #252737;
      color: #e7e8f2;
      font: inherit;
      font-size: .83rem;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }

    button:hover { border-color: rgba(130, 217, 255, .55); background: #2b3044; }
    button:active { transform: translateY(1px); }
    button.primary { border-color: transparent; background: #4aa9ce; color: #101923; font-weight: 700; }
    button.primary:hover { background: #70c6e8; }

    .note { margin: 15px 2px 0; color: #85869a; font-size: .78rem; line-height: 1.6; }

    @media (max-width: 680px) {
      body { padding: 24px 14px; }
      .controls { grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 19px 16px; padding: 18px; }
      .buttons { justify-content: flex-end; grid-column: 1 / -1; }
      .readouts { gap: 10px; right: 12px; }
      .readout { min-width: 64px; }
      .stage-label { top: 62px; left: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Physics · Interactive Lab</p>
      <h1>双摆混沌模拟器</h1>
      <p class="subtitle">拖动任意摆球改变初始状态，观察经典双摆的混沌运动。</p>
    </header>

    <section class="simulator" aria-label="双摆物理模拟器">
      <div class="stage">
        <canvas id="canvas" aria-label="双摆实时运动动画">你的浏览器不支持 Canvas。</canvas>
        <div class="stage-label">LAGRANGIAN DYNAMICS · RK4</div>
        <div class="readouts" aria-live="off">
          <div class="readout"><span>摆角 θ₁</span><strong id="angle1Readout">120.0°</strong></div>
          <div class="readout"><span>摆角 θ₂</span><strong id="angle2Readout">−10.0°</strong></div>
          <div class="readout"><span>时间</span><strong id="timeReadout">0.00 s</strong></div>
        </div>
      </div>
      <div class="controls">
        <div class="control">
          <label for="length"><span>双臂长度 L</span><output id="lengthValue">200 px</output></label>
          <input id="length" type="range" min="100" max="350" step="10" value="200">
        </div>
        <div class="control">
          <label for="gravity"><span>重力加速度 g</span><output id="gravityValue">9.8 m/s²</output></label>
          <input id="gravity" type="range" min="1" max="25" step="0.1" value="9.8">
        </div>
        <div class="control">
          <label for="damping"><span>阻尼</span><output id="dampingValue">0.003</output></label>
          <input id="damping" type="range" min="0" max="0.01" step="0.001" value="0.003">
        </div>
        <div class="buttons">
          <button id="playButton" class="primary" type="button">暂停</button>
          <button id="resetButton" type="button">重置摆动</button>
        </div>
      </div>
    </section>
    <p class="note">两个摆球质量相等，摆臂等长；使用拉格朗日方程与四阶 Runge–Kutta 积分。可直接拖动任意摆球改变角度，释放后观察混沌运动。</p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");
      if (!context) return;

      const lengthInput = document.getElementById("length");
      const gravityInput = document.getElementById("gravity");
      const dampingInput = document.getElementById("damping");
      const lengthValue = document.getElementById("lengthValue");
      const gravityValue = document.getElementById("gravityValue");
      const dampingValue = document.getElementById("dampingValue");
      const angle1Readout = document.getElementById("angle1Readout");
      const angle2Readout = document.getElementById("angle2Readout");
      const timeReadout = document.getElementById("timeReadout");
      const playButton = document.getElementById("playButton");

      const pixelsPerMeter = 100;
      const fixedStep = 1 / 240;
      const trail = [];
      const initialState = [120 * Math.PI / 180, 0, -10 * Math.PI / 180, 0];
      const mass1 = 1;
      const mass2 = 1;
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let state = initialState.slice();
      let elapsed = 0;
      let lastTrailTime = 0;
      let accumulator = 0;
      let previousFrame = 0;
      let paused = false;
      let draggedBob = 0;

      const lengthMeters = () => Number(lengthInput.value) / pixelsPerMeter;
      const gravity = () => Number(gravityInput.value);
      const damping = () => Number(dampingInput.value);
      const pendulumLengthPx = () => Number(lengthInput.value);

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function position() {
        const pivotX = width * 0.5;
        const pivotY = height * 0.5;
        const requestedLength = pendulumLengthPx();
        const displayScale = Math.min(
          1,
          (width - 72) / (2 * requestedLength),
          (Math.min(pivotY, height - pivotY) - 40) / (2 * requestedLength)
        );
        const drawnLength = requestedLength * Math.max(0.1, displayScale);
        const x1 = pivotX + drawnLength * Math.sin(state[0]);
        const y1 = pivotY + drawnLength * Math.cos(state[0]);
        const x2 = x1 + drawnLength * Math.sin(state[2]);
        const y2 = y1 + drawnLength * Math.cos(state[2]);
        return {
          pivotX,
          pivotY,
          x1,
          y1,
          x2,
          y2,
          lengthPx: drawnLength
        };
      }

      function derivative(currentState) {
        const [theta1, omega1, theta2, omega2] = currentState;
        const length = lengthMeters();
        const delta = theta1 - theta2;
        const inertia11 = (mass1 + mass2) * length * length;
        const inertia12 = mass2 * length * length * Math.cos(delta);
        const inertia22 = mass2 * length * length;
        const determinant = inertia11 * inertia22 - inertia12 * inertia12;
        const force1 = (
          -(mass1 + mass2) * gravity() * length * Math.sin(theta1)
          - mass2 * length * length * Math.sin(delta) * omega2 * omega2
          - damping() * omega1
        );
        const force2 = (
          mass2 * length * length * Math.sin(delta) * omega1 * omega1
          - mass2 * gravity() * length * Math.sin(theta2)
          - damping() * omega2
        );
        const theta1Acceleration = (force1 * inertia22 - inertia12 * force2) / determinant;
        const theta2Acceleration = (inertia11 * force2 - inertia12 * force1) / determinant;
        return [omega1, theta1Acceleration, omega2, theta2Acceleration];
      }

      function addScaled(base, increment, scale) {
        return base.map((value, index) => value + increment[index] * scale);
      }

      function integrate(dt) {
        const k1 = derivative(state);
        const k2 = derivative(addScaled(state, k1, dt / 2));
        const k3 = derivative(addScaled(state, k2, dt / 2));
        const k4 = derivative(addScaled(state, k3, dt));
        state = state.map((value, index) =>
          value + dt * (k1[index] + 2 * k2[index] + 2 * k3[index] + k4[index]) / 6
        );
      }

      function drawGrid() {
        const spacing = 36;
        context.strokeStyle = "rgba(166, 179, 226, 0.045)";
        context.lineWidth = 1;
        context.beginPath();
        for (let x = spacing; x < width; x += spacing) {
          context.moveTo(x, 0);
          context.lineTo(x, height);
        }
        for (let y = spacing; y < height; y += spacing) {
          context.moveTo(0, y);
          context.lineTo(width, y);
        }
        context.stroke();
      }

      function draw() {
        context.clearRect(0, 0, width, height);
        drawGrid();

        const { pivotX, pivotY, x1, y1, x2, y2 } = position();

        for (let i = 1; i < trail.length; i++) {
          const fade = i / trail.length;
          const hue = (i * 2.4 + elapsed * 34) % 360;
          context.beginPath();
          context.moveTo(trail[i - 1].x, trail[i - 1].y);
          context.lineTo(trail[i].x, trail[i].y);
          context.strokeStyle = `hsla(${hue}, 100%, 68%, ${fade * 0.66})`;
          context.lineWidth = 0.8 + fade * 2.4;
          context.stroke();
        }

        context.beginPath();
        context.moveTo(pivotX, pivotY);
        context.lineTo(x1, y1);
        context.lineTo(x2, y2);
        context.strokeStyle = "rgba(216, 224, 255, 0.76)";
        context.lineWidth = 2;
        context.stroke();

        context.beginPath();
        context.arc(pivotX, pivotY, 6, 0, Math.PI * 2);
        context.fillStyle = "#dfe8ff";
        context.shadowColor = "rgba(130, 217, 255, 0.5)";
        context.shadowBlur = 12;
        context.fill();
        context.shadowBlur = 0;

        drawBob(x1, y1, "#82d9ff", draggedBob === 1);
        drawBob(x2, y2, "#ff79db", draggedBob === 2);

        angle1Readout.textContent = `${(state[0] * 180 / Math.PI).toFixed(1)}°`;
        angle2Readout.textContent = `${(state[2] * 180 / Math.PI).toFixed(1)}°`;
        timeReadout.textContent = `${elapsed.toFixed(2)} s`;
      }

      function drawBob(x, y, color, isDragged) {
        const radius = isDragged ? 18 : 15;
        const glow = context.createRadialGradient(x, y, 2, x, y, 32);
        glow.addColorStop(0, isDragged ? "rgba(255, 121, 219, 0.3)" : "rgba(92, 205, 255, 0.24)");
        glow.addColorStop(1, "rgba(92, 205, 255, 0)");
        context.beginPath();
        context.arc(x, y, 32, 0, Math.PI * 2);
        context.fillStyle = glow;
        context.fill();

        const ball = context.createRadialGradient(x - 6, y - 7, 2, x + 2, y + 2, radius);
        ball.addColorStop(0, "#ffffff");
        ball.addColorStop(0.32, color);
        ball.addColorStop(1, isDragged ? "#a735aa" : "#287dab");
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fillStyle = ball;
        context.shadowColor = color;
        context.shadowBlur = 18;
        context.fill();
        context.shadowBlur = 0;
        context.lineWidth = 1;
        context.strokeStyle = "rgba(240, 249, 255, 0.72)";
        context.stroke();
      }

      function frame(timestamp) {
        if (!previousFrame) previousFrame = timestamp;
        const frameDelta = Math.min((timestamp - previousFrame) / 1000, 0.05);
        previousFrame = timestamp;

        if (!paused && draggedBob === 0) {
          accumulator += frameDelta;
          while (accumulator >= fixedStep) {
            integrate(fixedStep);
            elapsed += fixedStep;
            accumulator -= fixedStep;
          }

          if (elapsed - lastTrailTime >= 1 / 60) {
            const { x2, y2 } = position();
            trail.push({ x: x2, y: y2 });
            if (trail.length > 480) trail.shift();
            lastTrailTime = elapsed;
          }
        }

        draw();
        requestAnimationFrame(frame);
      }

      function resetAnimation() {
        state = initialState.slice();
        elapsed = 0;
        lastTrailTime = 0;
        accumulator = 0;
        trail.length = 0;
        draggedBob = 0;
        canvas.classList.remove("dragging");
        paused = false;
        playButton.textContent = "暂停";
        playButton.setAttribute("aria-label", "暂停模拟");
      }

      function updateControls() {
        lengthValue.textContent = `${lengthInput.value} px`;
        gravityValue.textContent = `${Number(gravityInput.value).toFixed(1)} m/s²`;
        dampingValue.textContent = damping().toFixed(3);
      }

      for (const input of [lengthInput, gravityInput, dampingInput]) {
        input.addEventListener("input", () => {
          updateControls();
          trail.length = 0;
          accumulator = 0;
          const { x2, y2 } = position();
          trail.push({ x: x2, y: y2 });
        });
      }

      function pointerPosition(event) {
        const bounds = canvas.getBoundingClientRect();
        return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
      }

      function updateDraggedAngle(event) {
        const pointer = pointerPosition(event);
        const { pivotX, pivotY, x1, y1 } = position();
        if (draggedBob === 1) {
          state[0] = Math.atan2(pointer.x - pivotX, pointer.y - pivotY);
        } else if (draggedBob === 2) {
          state[2] = Math.atan2(pointer.x - x1, pointer.y - y1);
        }
        state[1] = 0;
        state[3] = 0;
        accumulator = 0;
        trail.length = 0;
        const { x2, y2 } = position();
        trail.push({ x: x2, y: y2 });
      }

      canvas.addEventListener("pointerdown", event => {
        const pointer = pointerPosition(event);
        const { x1, y1, x2, y2 } = position();
        const distance1 = Math.hypot(pointer.x - x1, pointer.y - y1);
        const distance2 = Math.hypot(pointer.x - x2, pointer.y - y2);
        if (Math.min(distance1, distance2) > 30) return;

        draggedBob = distance1 <= distance2 ? 1 : 2;
        canvas.classList.add("dragging");
        canvas.setPointerCapture(event.pointerId);
        updateDraggedAngle(event);
        event.preventDefault();
      });

      canvas.addEventListener("pointermove", event => {
        if (draggedBob === 0) return;
        updateDraggedAngle(event);
      });

      function releasePointer(event) {
        if (draggedBob === 0) return;
        updateDraggedAngle(event);
        draggedBob = 0;
        canvas.classList.remove("dragging");
      }

      canvas.addEventListener("pointerup", releasePointer);
      canvas.addEventListener("pointercancel", releasePointer);

      playButton.addEventListener("click", () => {
        paused = !paused;
        playButton.textContent = paused ? "继续" : "暂停";
        playButton.setAttribute("aria-label", paused ? "继续模拟" : "暂停模拟");
      });

      document.getElementById("resetButton").addEventListener("click", resetAnimation);
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      updateControls();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
